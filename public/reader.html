<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>阅读 · 本地阅读</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="reader-body">
  <div class="reader-shell">
    <aside id="tocPanel" class="side-panel" hidden>
      <h3>目录</h3>
      <ul id="tocList"></ul>
    </aside>

    <aside id="notesPanel" class="side-panel" hidden>
      <h3>批注</h3>
      <ul id="notesList"></ul>
    </aside>

    <aside id="searchPanel" class="side-panel" hidden>
      <h3>检索</h3>
      <input id="searchInput" placeholder="输入关键词，回车检索" />
      <ul id="searchResults"></ul>
    </aside>

    <div class="reading-area">
      <div class="page-viewport">
        <h2 id="chapterTitle"></h2>
        <div id="pageScroller" class="page-scroller">
          <div id="pageContainer" class="page-container"></div>
        </div>
        <div id="pdfViewer" class="pdf-viewer" hidden>
          <canvas id="pdfCanvas"></canvas>
        </div>
      </div>

      <footer class="toolbar">
        <a href="index.html" class="btn">← 书架</a>
        <button id="prevPage" class="btn">上一页</button>
        <span id="pageIndicator" class="page-indicator"></span>
        <button id="nextPage" class="btn">下一页</button>
      </footer>
    </div>

    <div id="selectionPopup" class="selection-popup" hidden>
      <button id="highlightBtn">高亮 / 批注</button>
    </div>

    <nav class="tab-rail">
      <button id="toggleToc" class="tab-btn">目录</button>
      <button id="toggleNotes" class="tab-btn">批注</button>
      <button id="toggleSearch" class="tab-btn">检索</button>
      <button id="toggleTheme" class="tab-btn">日夜</button>
    </nav>
  </div>

  <script src="js/reader.js"></script>
  <script src="js/annotate.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
