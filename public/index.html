<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>书架 · 本地阅读</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>书架</h1>
      <p>静室藏书 · 随处可读</p>
    </div>
    <label class="import-btn">
      纳新
      <input type="file" id="fileInput" accept=".txt,.epub" hidden />
    </label>
  </header>

  <main>
    <div id="shelf" class="shelf"></div>
    <p id="emptyHint" class="hint" hidden>书架空空如也，点击右上角"纳新"导入第一本书。</p>
  </main>

  <script src="js/bookshelf.js"></script>
</body>
</html>
